<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Ритуальная служба</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="header"></header>
  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Вход в систему</h1>
        <p class="auth-sub">Войдите, чтобы оформлять заявки и отслеживать их статус</p>
        <div id="alertBox" class="alert"></div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label form-required">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.ru" required />
          </div>
          <div class="form-group">
            <label class="form-label form-required">Пароль</label>
            <input type="password" class="form-control" id="password" placeholder="Пароль" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <p class="auth-links">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        <p class="auth-links text-sm"><a href="index.html">← На главную</a></p>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
